name: Build APK

# Builds the app on every push and publishes it as the "latest" release,
# so the APK is always at:
#   https://github.com/markybadz/android-pedometer-app/releases/latest/download/pedometer.apk
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk pedometer.apk

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pedometer-apk
          path: pedometer.apk

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest pedometer.apk \
            --title "Pedometer app_Android" \
            --notes "Built automatically from \`${GITHUB_REF_NAME}\` at commit ${GITHUB_SHA::7}. Debug-signed: allow installing from unknown sources to install it." \
            --target "$GITHUB_SHA" \
            --latest
