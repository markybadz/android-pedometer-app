plugins {
    id 'com.android.application'
}

android {
    namespace 'name.bagi.levente.pedometer'
    compileSdk 36

    defaultConfig {
        // Your own app ID: Google Play won't accept the original author's
        // package name. (The Java package stays name.bagi.levente.pedometer.)
        applicationId 'io.github.markybadz.pedometer'
        // Health Connect requires Android 8.0 (API 26) or newer.
        minSdk 26
        // Google Play requires Android 16 (API 36) for new apps and updates.
        targetSdk 36
        versionCode 10
        versionName '2.3.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // A fixed debug key, so every build from GitHub Actions is signed the
    // same way and installs as an update over the previous one. It is a
    // test key only (password "android", like Android's own debug key);
    // use a private release key before publishing to the Play Store.
    signingConfigs {
        debug {
            storeFile file('ci-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Play Store upload key, supplied by GitHub Actions secrets
        // (see docs/PLAY_STORE.md). Never commit the real key.
        if (System.getenv('RELEASE_KEYSTORE_PATH')) {
            release {
                storeFile file(System.getenv('RELEASE_KEYSTORE_PATH'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (System.getenv('RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Android framework calls (Log etc.) return defaults in JVM unit tests.
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Reads steps the Zepp app (Amazfit) writes to Health Connect
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.activity:activity:1.9.3'

    // Modern Settings screen (Material 3 switches, value summaries)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
